        function HabitList({ initialData, onSave, isReadOnly, validationData, onValidate, userRole }) {

            const [expandedHabit, setExpandedHabit] = React.useState(null);
            const [showConfirm, setShowConfirm] = React.useState(false);

            React.useEffect(() => {
                const defaults = {};
                HABITS.forEach(h => { defaults[h.id] = initialData[h.id] || { status: false, timeValue: '' }; });
                setData(defaults);
            }, [initialData]);

            const handleChange = (id, field, value) => {
                if (isReadOnly) return;
                const newData = { ...data, [id]: { ...data[id], [field]: value } };
                if (id === 'h1' && field === 'timeValue') { 
                    const [h, m] = value.split(':').map(Number);
                    newData[id].status = (h + m/60) >= 4 && (h + m/60) <= 5.5;
                }
                if (id === 'h7' && field === 'timeValue') { 
                    const [h, m] = value.split(':').map(Number);
                    newData[id].status = (h + m/60) >= 18 && (h + m/60) <= 21.5; 
                }
                setData(newData);
            };

            const completionPct = Math.round((Object.values(data).filter(v => v.status).length / HABITS.length) * 100);

                <div className="space-y-4 relative">

                                    </div>
                                    <div className="flex items-center gap-4">
                                        {habit.type === 'time' && <TimePicker24H value={itemData.timeValue} onChange={(val) => handleChange(habit.id, 'timeValue', val)} disabled={isReadOnly} />}
                                        <button disabled={isReadOnly || habit.type === 'time'} onClick={() => handleChange(habit.id, 'status', !itemData.status)} className={`w-12 h-12 rounded-full flex items-center justify-center transition-all ${itemData.status ? 'bg-green-500 text-white shadow-green-200 shadow-lg scale-105' : 'bg-slate-100 text-slate-300 hover:bg-slate-200'}`}>
                                            {itemData.status ? <Icons.CheckCircle /> : <div className="w-4 h-4 rounded-full border-2 border-slate-300" />}
                                        </button>
                                    </div>
                                </div>
                                {isExpanded && (
                                    <div className="mt-4 pt-3 border-t border-slate-100 bg-slate-50/50 -mx-4 -mb-4 p-4 rounded-b-xl animate-fade-in-down">
                                        <p className="text-xs font-bold text-slate-500 uppercase mb-2">Kegiatan:</p>
                                        <ul className="space-y-1">{habit.items.map((item, idx) => (<li key={idx} className="text-sm text-slate-600 flex items-start gap-2"><div className="w-1.5 h-1.5 rounded-full bg-blue-400 mt-1.5 shrink-0" /><span>{item}</span></li>))}</ul>
                                    </div>
                                )}
                            </Card>
                        );
                    })}

                    {isReadOnly && (userRole === 'teacher' || userRole === 'parent') && (
                        <Card className="p-4 bg-blue-50 border-blue-200">
                            <h4 className="text-xs font-bold text-blue-600 uppercase mb-3">Validasi {userRole === 'teacher' ? 'Guru' : 'Orang Tua'}</h4>
                            <div className="grid grid-cols-2 gap-2">
                                {VALIDATION_OPTIONS.map(opt => (
                                    <button 
                                        key={opt.rating}
                                        onClick={() => onValidate(opt)}
                                        className={`p-2 rounded-lg border text-xs font-bold flex items-center justify-center gap-2 transition-all ${validationData?.rating === opt.rating ? opt.color + ' border-blue-400 shadow-sm' : 'bg-white text-slate-600 border-slate-200 hover:bg-white'}`}
                                    >
                                        <span>{opt.icon}</span> {opt.rating}
                                    </button>
                                ))}
                            </div>
                        </Card>
                    )}

                    {!isReadOnly && <div className="sticky bottom-4"><button onClick={() => setShowConfirm(true)} className="w-full bg-blue-600 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-200 active:scale-95 transition-all">Simpan Jurnal</button></div>}
                    
                    {showConfirm && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-[100] p-4 animate-fade-in-up">
                            <div className="bg-white w-full max-w-sm rounded-2xl p-6 shadow-2xl text-center">
                                <div className="w-16 h-16 bg-yellow-100 text-yellow-600 rounded-full flex items-center justify-center mx-auto mb-4"><span className="text-3xl">⚠️</span></div>
                                <h3 className="font-bold text-lg text-slate-800 mb-2">Simpan Data?</h3>
                                <p className="text-sm text-slate-500 mb-6">Pastikan data sudah benar. Jurnal hanya dapat diisi satu kali setiap hari.</p>
                                <div className="flex gap-3">
                                    <button onClick={() => setShowConfirm(false)} className="flex-1 py-2 text-slate-600 font-medium hover:bg-slate-100 rounded-lg">Cek Lagi</button>
                                    <button onClick={() => { setShowConfirm(false); onSave({ ...data, completionPercentage: completionPct }); }} className="flex-1 py-2 bg-blue-600 text-white font-bold rounded-lg shadow-md">Ya, Simpan</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function LoginScreen({ onLogin }) {
            const [role, setRole] = React.useState('student');
            const [selectedGrade, setSelectedGrade] = React.useState('I'); 
            const [selectedSubClass, setSelectedSubClass] = React.useState('IA');
            const [username, setUsername] = React.useState('');
            const [password, setPassword] = React.useState('');
            const [loginError, setLoginError] = React.useState(''); 

            const availableSubClasses = React.useMemo(() => {
                const GRADE_MAP = {
                    'I': ['IA', 'IB', 'IC'],
                    'II': ['IIA', 'IIB'],
                    'III': ['IIIA', 'IIIB'],
                    'IV': ['IVA', 'IVB', 'IVC'],
                    'V': ['VA', 'VB'],
                    'VI': ['VIA', 'VIB']
                };
                return GRADE_MAP[selectedGrade] || [];
            }, [selectedGrade]);

            React.useEffect(() => { if (availableSubClasses.length > 0) setSelectedSubClass(availableSubClasses[0]); }, [selectedGrade, availableSubClasses]);
            const filteredStudents = React.useMemo(() => ALL_STUDENTS.filter(s => s.classId === selectedSubClass), [selectedSubClass]);

            const handleTeacherLogin = () => {
                const teacher = TEACHERS.find(t => 
                    t.username.toLowerCase() === username.trim().toLowerCase() && 
                    t.password === password
                );
                
                if (teacher) {
                    onLogin({ id: teacher.id, name: teacher.name, role: 'teacher', classes: teacher.classes });
                } else {
                    setLoginError("Username atau Password salah.");
                }
            };

            return (
                <div className="h-full min-h-screen bg-gradient-to-br from-blue-500 to-indigo-600 flex flex-col items-center justify-center p-4">
                    <Card className="w-full p-6 animate-fade-in-up shadow-xl">
                        <div className="text-center mb-8">
                            <div className="flex justify-center mb-6">
                                {/* Menggunakan endpoint lh3 yang lebih stabil untuk embedding Google Drive */}
                                <img 
                                    src="https://lh3.googleusercontent.com/d/14QQzUm-j6uwqiLzUPRdsaltCg_wOhuOO" 
                                    alt="Logo SDN 001 Ujoh Bilang" 
                                    className="w-24 h-24 object-contain"
                                    loading="lazy"
                                    onError={(e) => { 
                                        e.target.onerror = null; 
                                        e.target.src = 'https://placehold.co/150x150/e2e8f0/475569?text=SDN+001'; 
                                    }}
                                />
                            </div>
                            <h1 className="text-3xl font-extrabold text-blue-700 tracking-tight">Jurnal KAIH</h1>
                            <p className="text-slate-500 text-sm font-semibold mt-1 uppercase tracking-tight">SDN 001 Ujoh Bilang</p>
                        </div>

                        <div className="flex bg-slate-100 p-1 rounded-lg mb-6">
                            {['student', 'parent', 'teacher'].map(r => (
                                <button key={r} onClick={() => setRole(r)} className={`flex-1 py-2 text-sm font-medium rounded-md transition-all ${role === r ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-500'}`}>{r === 'student' ? 'Siswa' : r === 'parent' ? 'Orang Tua' : 'Guru'}</button>
                            ))}
                        </div>

                        <div className="space-y-4">
                            {role === 'teacher' ? (
                                <div className="space-y-3">
                                    <input type="text" value={username} onChange={(e) => setUsername(e.target.value)} className="w-full border rounded-lg p-2 text-sm outline-blue-500" placeholder="Username"/>
                                    <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} className="w-full border rounded-lg p-2 text-sm outline-blue-500" placeholder="Password"/>
                                    {loginError && <div className="text-red-500 text-[10px] text-center bg-red-50 p-2 rounded border border-red-100">{loginError}</div>}
                                    <button onClick={handleTeacherLogin} className="w-full bg-blue-600 text-white font-bold py-3 rounded-xl shadow-lg active:scale-95 transition-all">Masuk Guru</button>
                                </div>
                            ) : (
                                <>
                                    <div className="flex gap-2 overflow-x-auto pb-2 scrollbar-hide">
                                        {['I', 'II', 'III', 'IV', 'V', 'VI'].map(c => (
                                            <button key={c} onClick={() => setSelectedGrade(c)} className={`flex-1 min-w-[50px] px-3 py-2 rounded-lg text-sm font-medium border ${selectedGrade === c ? 'bg-blue-600 text-white shadow-md' : 'bg-white text-slate-600 border-slate-200'}`}>{c}</button>
                                        ))}
                                    </div>
                                    <select value={selectedSubClass} onChange={(e) => setSelectedSubClass(e.target.value)} className="w-full bg-white border border-slate-300 py-3 px-4 rounded-xl font-medium outline-blue-500">
                                        {availableSubClasses.map(cls => <option key={cls} value={cls}>Kelas {cls}</option>)}
                                    </select>
                                    <div className="max-h-60 overflow-y-auto space-y-2 border rounded-xl p-2 bg-slate-50 student-list">
                                        {filteredStudents.map(s => (
                                            <button key={s.id} onClick={() => onLogin({ id: role === 'student' ? s.id : `parent_${s.id}`, name: role === 'student' ? s.name : `Orang Tua ${s.name}`, role, classId: s.classId, childId: s.id })} className="w-full flex items-center p-3 bg-white border rounded-lg hover:border-blue-500 transition-all text-left group">
                                                <div className="w-8 h-8 rounded-full bg-slate-100 group-hover:bg-blue-50 flex items-center justify-center mr-3 text-xs font-bold">{s.name.substring(0, 1)}</div>
                                                <div className="flex-1"><span className="block text-xs font-medium text-slate-700">{s.name}</span><span className="block text-[10px] text-slate-400">{s.classId}</span></div>
                                            </button>
                                        ))}
                                    </div>
                                </>
                            )}
                        </div>
                    </Card>
                </div>
            );
        }

        function StudentDashboard({ user, firebaseUser }) {
            const [date, setDate] = React.useState(new Date().toISOString().split('T')[0]);
            const [logData, setLogData] = React.useState({});
            const [toast, setToast] = React.useState(null);
            
            React.useEffect(() => {
                if (!firebaseUser) return;
                const docRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection(`logs_${user.id}`);
                return docRef.onSnapshot(snapshot => {
                    const logs = {};
                    snapshot.forEach(doc => logs[doc.id] = doc.data());
                    setLogData(logs);
                }, (error) => {
                    console.error("Snapshot error:", error);
                    setToast({ message: "Gagal memuat data", type: 'error' });
                });
            }, [firebaseUser, user.id]);

            const handleSave = async (habitData) => {
                try {
                    // 1. Simpan ke Firestore
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection(`logs_${user.id}`).doc(date).set({ ...habitData, date, studentId: user.id, studentName: user.name, classId: user.classId }, { merge: true });
                    
                    // 2. Sinkronisasi ke Google Sheet (jika error tidak memblokir UI)
                    fetch(GOOGLE_SHEET_SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        body: JSON.stringify({
                            ...habitData,
                            date,
                            studentName: user.name,
                            classId: user.classId,
                            role: 'student'
                        })
                    }).catch(err => console.log("Background sync error:", err));

                    setToast({ message: "Jurnal berhasil disimpan!", type: 'success' });
                } catch (e) { 
                    setToast({ message: "Terjadi kesalahan: " + e.message, type: 'error' });
                }
            };

            return (
                <div className="space-y-6 relative">
                    {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                    <div className="bg-blue-600 rounded-2xl p-6 text-white shadow-lg animate-fade-in-up">
                        <h2 className="text-lg font-bold">Halo, {user.name.split(' ')[0]}!</h2>
                        <p className="text-sm opacity-90">Ayo tunjukkan kebiasaan hebatmu hari ini.</p>
                    </div>
                    <div className="bg-white p-3 rounded-xl border flex justify-between items-center shadow-sm">
                        <div className="flex items-center gap-2 text-slate-500 font-bold text-sm"><Icons.Calendar/><span>Tanggal Jurnal</span></div>
                        <input type="date" value={date} onChange={(e) => setDate(e.target.value)} className="outline-none bg-blue-50 px-2 py-1 rounded text-sm font-bold text-blue-700"/>
                    </div>
                    <HabitList initialData={logData[date] || {}} onSave={handleSave} isReadOnly={!!logData[date]} userRole="student" />
                </div>
            );
        }

        function TeacherDashboard({ user, firebaseUser }) {
            const [date, setDate] = React.useState(new Date().toISOString().split('T')[0]);
            const [currentClass, setCurrentClass] = React.useState(user.classes[0]);
            const [classLogs, setClassLogs] = React.useState([]);
            const [selectedStudent, setSelectedStudent] = React.useState(null);
            const [toast, setToast] = React.useState(null);
            
            const myStudents = React.useMemo(() => ALL_STUDENTS.filter(s => s.classId === currentClass), [currentClass]);

            const fetchLogs = React.useCallback(async () => {
                try {
                    const logs = [];
                    // Karena ini dashboard guru, kita ambil per siswa dalam kelas.
                    // Idealnya menggunakan collectionGroup atau index, tetapi untuk mematuhi aturan "No Complex Queries",
                    // kita ambil dokumen satu per satu berdasarkan ID siswa di kelas tersebut.
                    for (const s of myStudents) {
                        const doc = await db.collection('artifacts').doc(appId).collection('public').doc('data').collection(`logs_${s.id}`).doc(date).get();
                        logs.push(doc.exists ? { ...doc.data(), studentName: s.name, studentId: s.id } : { studentName: s.name, studentId: s.id, notFilled: true });
                    }
                    setClassLogs(logs);
                } catch(error) {
                    console.error("Gagal mengambil log:", error);
                    setToast({ message: "Gagal memuat data kelas", type: 'error' });
                }
            }, [myStudents, date]);

            React.useEffect(() => { fetchLogs(); }, [fetchLogs]);

            const handleValidate = async (option) => {
                if (!selectedStudent) return;
                try {
                    const valUpdate = { teacherValidation: option };
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection(`logs_${selectedStudent.studentId}`).doc(date).update(valUpdate);
                    
                    fetch(GOOGLE_SHEET_SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        body: JSON.stringify({
                            date,
                            studentName: selectedStudent.studentName,
                            classId: currentClass,
                            role: 'teacher',
                            teacherValidation: option
                        })
                    }).catch(err => console.log("Background sync error:", err));

                    setSelectedStudent({ ...selectedStudent, ...valUpdate });
                    fetchLogs();
                    setToast({ message: "Validasi berhasil disimpan", type: 'success' });
                } catch (e) { 
                    setToast({ message: "Gagal validasi: " + e.message, type: 'error' });
                }
            };

            const filledCount = classLogs.filter(l => !l.notFilled).length;

            return (
                <div className="space-y-6 relative">
                    {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                    <div className="bg-slate-800 rounded-2xl p-6 text-white shadow-lg">
                        <div className="flex justify-between items-start mb-4">
                            <div><h2 className="text-lg font-bold">Portal Guru</h2><p className="text-[10px] opacity-70 truncate max-w-[200px]">{user.name}</p></div>
                            <div className="bg-blue-500/30 p-2 rounded-lg text-center"><span className="block text-xl font-bold leading-none">{filledCount}/{myStudents.length}</span><span className="text-[8px] uppercase">Selesai</span></div>
                        </div>
                        {user.classes.length > 1 && (
                            <div className="space-y-1">
                                <label className="text-[10px] uppercase font-bold text-slate-400">Pilih Kelas:</label>
                                <select value={currentClass} onChange={(e) => setCurrentClass(e.target.value)} className="w-full bg-slate-700 text-white rounded p-2 text-sm outline-none border border-slate-600">
                                    {user.classes.map(cls => <option key={cls} value={cls}>Kelas {cls}</option>)}
                                </select>
                            </div>
                        )}
                    </div>
                    <div className="bg-white p-3 rounded-xl border flex justify-between items-center shadow-sm"><Icons.Calendar/><input type="date" value={date} onChange={(e) => {setDate(e.target.value); setSelectedStudent(null);}} className="outline-none font-bold text-blue-600"/></div>
                    <Card><div className="bg-slate-100 p-3 font-bold border-b text-slate-500 text-[10px] uppercase tracking-wider italic">Daftar Siswa ({currentClass})</div>
                        <div className="divide-y max-h-[400px] overflow-y-auto student-list">
                            {classLogs.map((l, i) => (
                                <div key={i} onClick={() => !l.notFilled && setSelectedStudent(l)} className={`p-4 flex justify-between items-center ${!l.notFilled ? 'cursor-pointer hover:bg-blue-50' : 'opacity-50'}`}>
                                    <div className="flex-1"><span className="block text-[11px] font-bold text-slate-700 leading-tight">{l.studentName}</span></div>
                                    {l.notFilled ? <span className="text-[9px] px-2 py-0.5 bg-red-100 text-red-600 rounded-full font-bold">Belum isi</span> : <span className={`text-[9px] px-2 py-0.5 rounded-full font-bold uppercase ${l.teacherValidation ? 'bg-blue-100 text-blue-600' : 'bg-green-100 text-green-600'}`}>{l.teacherValidation ? l.teacherValidation.rating : 'Selesai'}</span>}
                                </div>
                            ))}
                        </div>
                    </Card>
                    {selectedStudent && <div className="fixed inset-0 bg-black/60 z-[100] p-4 flex items-center justify-center animate-fade-in-up">
                        <Card className="w-full max-h-[90vh] overflow-y-auto p-4">
                            <div className="flex justify-between items-center mb-4 font-bold border-b pb-2">
                                <div className="text-sm"><span className="block text-slate-400 text-[10px]">Review Jurnal:</span><span className="text-blue-600">{selectedStudent.studentName}</span></div>
                                <button onClick={() => setSelectedStudent(null)} className="p-2 bg-slate-100 rounded-full hover:bg-slate-200"><Icons.Close/></button>
                            </div>
                            <HabitList 
                                initialData={selectedStudent} 
                                isReadOnly={true} 
                                userRole="teacher"
                                validationData={selectedStudent.teacherValidation}
                                onValidate={handleValidate}
                            />
                        </Card>
                    </div>}
                </div>
            );
        }

        function ParentDashboard({ user, firebaseUser }) {
            const [date, setDate] = React.useState(new Date().toISOString().split('T')[0]);
            const [childLog, setChildLog] = React.useState(null);
            const [toast, setToast] = React.useState(null);
            
            React.useEffect(() => {
                if (!user.childId) return;
                const docRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection(`logs_${user.childId}`).doc(date);
                return docRef.onSnapshot(d => {
                    setChildLog(d.exists ? { ...d.data(), studentId: user.childId } : null);
                }, (error) => {
                    console.error("Snapshot error:", error);
                    setToast({ message: "Gagal memuat data", type: 'error' });
                });
            }, [user.childId, date]);

            const handleValidate = async (option) => {
                if (!childLog) return;
                try {
                    const valUpdate = { parentValidation: option };
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection(`logs_${user.childId}`).doc(date).update(valUpdate);
                    
                    fetch(GOOGLE_SHEET_SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        body: JSON.stringify({
                            date,
                            studentName: user.name.replace('Orang Tua ', ''),
                            classId: user.classId,
                            role: 'parent',
                            parentValidation: option
                        })
                    }).catch(err => console.log("Background sync error:", err));

                    setChildLog({ ...childLog, ...valUpdate });
                    setToast({ message: "Validasi berhasil disimpan", type: 'success' });
                } catch (e) { 
                    setToast({ message: "Gagal validasi: " + e.message, type: 'error' });
                }
            };

            return (
                <div className="space-y-6 relative">
                    {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                    <div className="bg-purple-600 rounded-2xl p-6 text-white shadow-lg">
                        <h2 className="text-lg font-bold">Portal Orang Tua</h2>
                        <p className="text-sm opacity-80">Memantau: {user.name.replace('Orang Tua ', '')}</p>
                    </div>
                    <div className="bg-white p-3 rounded-xl border flex justify-between items-center"><Icons.Calendar/><input type="date" value={date} onChange={(e) => setDate(e.target.value)} className="outline-none font-bold text-purple-600"/></div>
                    {!childLog ? <div className="text-center py-12 bg-white rounded-xl border border-dashed border-slate-200">
                        <div className="text-4xl mb-2">⏳</div>
                        <p className="text-slate-400 text-sm italic">Siswa belum mengisi jurnal<br/>pada tanggal ini.</p>
                    </div> : <HabitList 
                        initialData={childLog} 
                        isReadOnly={true} 
                        userRole="parent"
                        validationData={childLog.parentValidation}
                        onValidate={handleValidate}
                    />}
                </div>
            );
        }

        function App() {
            const [user, setUser] = React.useState(null);
            const [appUser, setAppUser] = React.useState(null);
            const [loading, setLoading] = React.useState(true);

            React.useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await auth.signInWithCustomToken(__initial_auth_token).catch(() => auth.signInAnonymously());
                        } else {
                            await auth.signInAnonymously();
                        }
                    } catch (error) {
                        console.error("Auth error:", error);
                    }
                };
                
                if (auth) {
                    initAuth();
                    const unsubscribe = auth.onAuthStateChanged((u) => { 
                        setUser(u); 
                        setLoading(false); 
                    });
                    return () => unsubscribe();
                } else {
                    setLoading(false); // Fallback jika firebase config gagal
                }
            }, []);

            if (loading) return <div className="h-screen flex items-center justify-center bg-slate-100 text-slate-500 italic">Memuat Jurnal KAIH...</div>;
            if (!auth) return <div className="h-screen flex items-center justify-center bg-red-50 text-red-500 font-bold p-4 text-center">Sistem Gagal Memuat.<br/>Periksa konfigurasi database.</div>;
            
            if (!appUser) return <LoginScreen onLogin={setAppUser} />;

            return (
                <div className="min-h-screen font-sans text-slate-800 pb-20 bg-slate-50">
                    <header className="bg-white border-b sticky top-0 z-50 px-4 h-16 flex items-center justify-between">
                        <h1 className="font-bold text-sm text-blue-600 tracking-tighter">Jurnal KAIH</h1>
                        <div className="flex items-center gap-3">
                            <div className="text-right">
                                <span className="block text-[10px] font-bold text-blue-500 uppercase leading-none">{appUser.role === 'teacher' ? 'Guru' : appUser.role === 'parent' ? 'Orang Tua' : 'Siswa'}</span>
                                <span className="block text-xs font-semibold text-slate-600 truncate max-w-[140px] leading-tight">{appUser.name}</span>
                            </div>
                            <button onClick={() => setAppUser(null)} className="p-2 text-red-500 bg-red-50 rounded-lg hover:bg-red-100 transition-colors"><Icons.LogOut/></button>
                        </div>
                    </header>
                    <main className="w-full p-4">
                        {appUser.role === 'student' && <StudentDashboard user={appUser} firebaseUser={user} />}
                        {appUser.role === 'teacher' && <TeacherDashboard user={appUser} firebaseUser={user} />}
                        {appUser.role === 'parent' && <ParentDashboard user={appUser} firebaseUser={user} />}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
